<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTuber Hub - Discover Creators</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand-badge">
            <span class="brand-icon"></span>
            <h1>YouTuber Hub</h1>
        </div>
        <p>Explore top creators, channels, and sub counts</p>
    </header>

    <main>
        <section class="search-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search YouTubers, handles, or topics..." onkeyup="handleRealtimeSearch()">
                <button class="primary-btn" onclick="handleRealtimeSearch()">Search</button>
            </div>

            <div class="controls-row">
                <div class="category-chips" id="categoryContainer"></div>

                <div class="sort-container">
                    <label for="sortSelect">Sort By:</label>
                    <select id="sortSelect" onchange="sortAndDisplayYoutubers()">
                        <option value="subs">Most Subscribers</option>
                        <option value="views">Total Views</option>
                        <option value="videos">Video Count</option>
                    </select>
                </div>
            </div>
        </section>

        <div id="searchBanner" class="search-banner" style="display: none;"></div>

        <h2>Featured YouTubers</h2>
        <div class="youtuber-list" id="youtuberList"></div>
    </main>

    <!-- CREATOR PROFILE MODAL -->
    <div class="modal-overlay" id="creatorModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal()">&times;</button>
            
            <img id="modalBanner" class="modal-banner" src="" alt="Banner">
            
            <div class="modal-header-info">
                <button class="subscribe-btn">Subscribe</button>
                <div class="modal-avatar-wrapper">
                    <img id="modalAvatar" class="modal-avatar" src="" alt="Avatar">
                </div>
                <h2 id="modalName" style="margin: 0; color: white;">Creator Name</h2>
                <div id="modalHandle" style="color: #aaa; font-size: 0.9rem;">@handle</div>
            </div>

            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span>Subscribers</span>
                        <strong id="modalSubs">0</strong>
                    </div>
                    <div class="stat-item">
                        <span>Total Views</span>
                        <strong id="modalViews">0</strong>
                    </div>
                    <div class="stat-item">
                        <span>Videos</span>
                        <strong id="modalVideoCount">0</strong>
                    </div>
                </div>

                <h4 style="color: #ff0000; margin: 0 0 8px 0; text-transform: uppercase; font-size: 0.85rem;">About Channel</h4>
                <p id="modalBio" style="color: #ccc; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;"></p>

                <h4 style="color: #ff0000; margin: 0 0 10px 0; text-transform: uppercase; font-size: 0.85rem;">Most Popular Upload</h4>
                <div class="popular-upload">
                    <img id="modalUploadThumb" src="" alt="Video Thumbnail">
                    <div>
                        <strong id="modalUploadTitle" style="color: white; font-size: 0.9rem; display: block;">Video Title</strong>
                        <span id="modalUploadViews" style="color: #aaa; font-size: 0.8rem;">0 views</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 YouTuber Hub - Creator Analytics</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
